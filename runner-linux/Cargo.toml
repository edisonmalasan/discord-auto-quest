[package]
name = "discord-auto-quest-runner-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The Linux stub process the app launches in place of a game."
license = "MIT"
publish = false

[[bin]]
name = "discord-auto-quest-runner"
path = "src/main.rs"

# The runner has no dependencies at all. It needs nothing from the system but the
# C library that is already on every machine with a desktop, and in particular
# nothing from a graphical toolkit.
[dependencies]

# The runner is a process that stays alive. Every byte of it is a byte the user
# pays for, so it is built as small as it can be.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
