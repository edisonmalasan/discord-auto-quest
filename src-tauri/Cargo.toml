[package]
name = "discord-auto-quest"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A desktop app that completes Discord quests for games you do not own."
license = "MIT"
publish = false

[lib]
name = "discord_auto_quest_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# This feature is used for production builds, where the frontend assets are embedded
# in the binary rather than loaded from the dev server. Do not remove it.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
    "http2",
    "macos-system-configuration",
] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
