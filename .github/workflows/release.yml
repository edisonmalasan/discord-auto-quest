# Verify each candidate before creating a draft release.
name: release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run version:check
      - run: npm run check:terms
      - run: npm run check:notices
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - run: npm run check:acceptance
  build:
    name: windows build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Candidate version
        id: version
        shell: bash
        run: node --input-type=module -e "import {readVersion} from './tools/version.mjs'; console.log('version='+readVersion())" >> "$GITHUB_OUTPUT"
      - name: Windows candidate
        run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate
          path: target/release/${{ steps.version.outputs.version }}/*
          if-no-files-found: error
  macos:
    name: macos build
    if: vars.ENABLE_MACOS_BUILDS == 'true'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: macOS compilation only
        run: |
          npm run build
          cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
          node tools/check-payload.mjs src-tauri/target/release/discord-auto-quest
  draft:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@v4
        with:
          name: windows-candidate
          path: candidate
      - name: Create draft from verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish.mjs draft candidate
