name: Bug report
description: Report a reproducible application problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security concerns use SECURITY.md. Do not include tokens, account identifiers, private messages, or unredacted diagnostics."
  - type: input
    id: version
    attributes:
      label: App and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
