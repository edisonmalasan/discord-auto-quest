[package]
name = "discord-auto-quest-runner-macos"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The macOS stub process the app launches in place of a game."
license = "MIT"
publish = false

[[bin]]
name = "discord-auto-quest-runner-macos"
path = "src/main.rs"

# The macOS runner is a window, so it needs a windowing library. It is the one
# platform where a window is not a choice: Discord on macOS detects applications,
# not bare executables.
[dependencies]
winit = "0.30"

# The runner is a process that stays alive. Every byte of it is a byte the user
# pays for, so it is built as small as it can be.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
